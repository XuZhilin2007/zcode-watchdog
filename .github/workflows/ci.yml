name: Offline safety and Windows CLI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - run: node scripts/check.mjs
      - run: node --test --test-concurrency=1 test/*.test.mjs
        env:
          ZWD_CI_TASK_TEST: '1'
      - run: npm run pack:release
      - run: node scripts/package-smoke.mjs
